<style>
/* Layout: a one-screen phone app. Every screen is head / body / foot inside the viewport height,
   built from the brand's five rounded colour tiles. One deliberate look, so no dark variant. */
:root {
  --paper: #FFFCF3;
  --plum: #3B0525;
  --blue: #004AAD;
  --cream: #DEE5B1;
  --orange: #FF562F;
  --yellow: #FFCD02;
  --muted: #7B5A6B;
  --line: #EDE3D3;
  --white: #FFFFFF;

  --f-display: "Rammetto One", "Arial Black", Impact, system-ui, sans-serif;
  --f-body: "Signika", "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
  --r: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden; display: flex; flex-direction: column;
  background: var(--paper); color: var(--plum);
  font-family: var(--f-body); font-size: 16px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
}
#app {
  flex: 1; min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.screen > .head, .screen > .foot { flex: none; display: flex; flex-direction: column; gap: 8px; }
.screen > .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overscroll-behavior: contain; }
.screen > .body.fit { overflow: hidden; }
.grow { flex: 1; min-height: 0; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; line-height: 1.1; }
h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Brand tiles */
.c-blue   { background: var(--blue);   color: var(--cream); }

.c-orange { background: var(--orange); color: var(--cream); }

.swatches i { height: clamp(12px, 2.6vh, 26px); border-radius: 10px; }

.tile {
  border: 0; border-radius: var(--r); padding: 12px 14px; text-align: center; min-height: 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%;
}
.tile .sm { font-weight: 700; font-size: clamp(12px, min(3.8vw, 2.1vh), 17px); letter-spacing: .04em; text-transform: uppercase; }
.tile .lg { font-family: var(--f-display); font-size: clamp(20px, min(7.2vw, 4.2vh), 36px); line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; max-width: 100%; }
button.tile { transition: transform .12s ease; }

.wordmark .sm { font-weight: 700; font-size: clamp(16px, min(5.5vw, 3vh), 26px); letter-spacing: .03em; }
.wordmark .lg { font-family: var(--f-display); font-size: clamp(38px, min(16vw, 8.5vh), 88px); line-height: .95; overflow-wrap: anywhere; }
.logo { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 797 / 247; min-height: 0; }

/* Home: the brand board as a menu */

}

/* Buttons */
.btn {

.resume b { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; }

/* Panels and form bits */
.panel { background: var(--white); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }

.chip[aria-pressed="true"] { background: var(--plum); color: var(--yellow); }
.chip:disabled { opacity: .35; }
.chip small { font-weight: 600; opacity: .7; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg .chip { padding: 8px 4px; text-align: center; }
.subtabs .chip { border-width: 0; background: var(--cream); }
.subtabs .chip[aria-pressed="true"] { background: var(--plum); }
.hint { font-size: 14px; color: var(--muted); }
.saved-note { font-size: 13px; color: var(--good); font-weight: 700; min-height: 1em; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--plum); flex: none; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--orange); }

/* Tab bar sits in the layout, not on top of it */
.tabbar { flex: none; background: var(--plum); padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tabbar button { border: 0; background: transparent; color: var(--cream); padding: 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.tabbar button i { width: 20px; height: 12px; border-radius: 4px; background: currentColor; opacity: .5; }
.tabbar button[aria-current="true"] { color: var(--yellow); }

/* Cards */
.card3d { position: relative; perspective: 1400px; flex: 1; min-height: 170px; }
.card3d .inner { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); }
.card3d.flip .inner { animation: flipin .85s cubic-bezier(.3,.7,.2,1) both; }
@keyframes flipin { 0%, 40% { transform: rotateY(0); } 100% { transform: rotateY(180deg); } }
.face { position: absolute; inset: 0; border-radius: 24px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; padding: 14px 16px; }
.face.front { align-items: center; justify-content: center; text-align: center; }
.face.front .sm { font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.face.front .lg { font-family: var(--f-display); font-size: clamp(38px, min(13vw, 8vh), 66px); text-transform: uppercase; line-height: 1; }
.face.back { transform: rotateY(180deg); background: var(--white); border: 10px solid var(--catbg); }
.face.back .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cat-chip { background: var(--catbg); color: var(--catfg); border-radius: 10px; padding: 4px 10px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.word { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-display); font-size: clamp(28px, min(10vw, 6.5vh), 52px); line-height: 1.08; overflow-wrap: anywhere; text-wrap: balance; }
.star { border: 0; background: var(--cream); color: var(--plum); border-radius: 12px; padding: 6px 11px; font-weight: 700; font-size: 14px; }
.star[aria-pressed="true"] { background: var(--yellow); }
.card-note { text-align: center; font-weight: 600; color: var(--muted); font-size: 14px; }
.flat-card { flex: 1; min-height: 150px; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
.flat-card .lg { font-family: var(--f-display); font-size: clamp(34px, min(12vw, 7vh), 64px); text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; max-width: 100%; }

[data-cat="object"] { --catbg: var(--blue);   --catfg: var(--cream); }
[data-cat="person"] { --catbg: var(--yellow); --catfg: var(--plum); }
[data-cat="place"]  { --catbg: var(--orange); --catfg: var(--cream); }
[data-cat="world"]  { --catbg: var(--plum);   --catfg: var(--yellow); }
[data-cat="action"] { --catbg: var(--cream);  --catfg: var(--orange); }
[data-cat="nature"] { --catbg: var(--cream);  --catfg: var(--blue); }
[data-cat="random"] { --catbg: var(--yellow); --catfg: var(--blue); }
.catfill { background: var(--catbg); color: var(--catfg); }
.face.front[data-cat="random"] { background: repeating-linear-gradient(-45deg, var(--yellow) 0 26px, #FFD54A 26px 52px); }

.card3d.out-got { animation: outGot .3s ease-in forwards; }
.card3d.out-skip { animation: outSkip .3s ease-in forwards; }
.card3d.out-bin { animation: outBin .3s ease-in forwards; }
@keyframes outGot { to { transform: translate(40%, -60%) rotate(18deg) scale(.7); opacity: 0; } }
@keyframes outSkip { to { transform: translateX(-120%) rotate(-14deg); opacity: 0; } }
@keyframes outBin { to { transform: translateY(70%) rotate(8deg) scale(.6); opacity: 0; } }
.stamp {
  position: absolute; left: 50%; top: 45%; z-index: 3; transform: translate(-50%, -50%) rotate(-12deg);
  font-family: var(--f-display); font-size: clamp(28px, 9vw, 44px); padding: 6px 16px; border-radius: 14px; white-space: nowrap;
  animation: stampin .18s ease-out both; pointer-events: none;
}
@keyframes stampin { from { transform: translate(-50%, -50%) rotate(-12deg) scale(1.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .card3d.flip .inner { animation: none; }
  .card3d.out-got, .card3d.out-skip, .card3d.out-bin { animation: fadeout .2s forwards; }
  .stamp { animation: none; }
}
@keyframes fadeout { to { opacity: 0; } }

/* Play */
.play-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.play-head .team { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; border: 0; background: none; padding: 0; }
.digits { font-family: var(--f-display); font-size: clamp(30px, 5vh, 40px); line-height: 1; font-variant-numeric: tabular-nums; text-align: center; min-width: 2ch; }
.digits.low { color: var(--orange); }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--plum); transform-origin: left; }
.bar.low i { background: var(--orange); }
.skipped-btn { justify-self: end; border: 0; background: var(--cream); color: var(--plum); border-radius: 12px; padding: 7px 11px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.skipped-btn:disabled { opacity: .45; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; }
.controls.two { grid-template-columns: 1fr 1fr; }
.controls .btn { padding: clamp(14px, 2.6vh, 20px) 6px; font-size: 16px; border-radius: 18px; }
.controls .btn.correct { font-family: var(--f-display); font-size: 19px; text-transform: uppercase; }
.score-pill { justify-self: end; background: var(--plum); color: var(--yellow); border-radius: 12px; padding: 6px 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini-scores { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.mini-scores .ms { flex: none; display: flex; align-items: center; gap: 6px; background: var(--cream); border-radius: 12px; padding: 6px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.mini-scores .ms b { font-family: var(--f-display); font-weight: 400; font-variant-numeric: tabular-nums; }
.mini-scores .ms.lead { background: var(--plum); color: var(--yellow); }

.sheet-back { position: fixed; inset: 0; background: rgb(58 10 38 / .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 80%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.list li > button, .list li > div {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
  background: var(--white); border: 2px solid var(--line); border-radius: 14px; padding: 9px 12px; font-weight: 600;
}
.list .w { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }

.x { border: 0; background: var(--line); border-radius: 10px; width: 32px; height: 32px; font-size: 18px; line-height: 1; flex: none; }

.big-num { display: flex; align-items: center; gap: 14px; border-radius: var(--r); padding: 12px 16px; }

.quip { font-family: var(--f-display); font-size: clamp(16px, 2.6vh, 20px); line-height: 1.2; }
.scoreboard { display: flex; flex-direction: column; gap: 6px; }
.scoreboard .rowx { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 9px 12px; }
.scoreboard .rowx .n { margin-left: auto; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.scoreboard .rowx .pos { font-family: var(--f-display); font-size: 16px; width: 1.4em; }
.scoreboard .rowx .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats .tile { padding: 10px; }

.codebar { border-radius: var(--r); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.codebar .code { font-family: var(--f-display); font-size: clamp(30px, 6vh, 42px); letter-spacing: .14em; line-height: 1; }
.code-input { font-family: var(--f-display); font-size: 26px; letter-spacing: .25em; text-transform: uppercase; text-align: center; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { background: var(--cream); border-radius: 10px; padding: 4px 10px; font-size: 14px; font-weight: 700; }

.invite { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; background: var(--cream); border-radius: 14px; padding: 10px 12px; }
.wait { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px 14px; text-align: center; color: var(--muted); font-weight: 700; }
.dots i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin: 0 3px; animation: bob 1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; } .dots i:nth-child(4) { animation-delay: .45s; } .dots i:nth-child(5) { animation-delay: .6s; }
@keyframes bob { 50% { transform: translateY(-10px); } }

.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;

<script>
/* ============ Reference data ============ */
const CATS = [

];

  nz: ["Auckland", "Wellington", "Christchurch", "Queenstown"],
  uk: ["London", "Manchester", "Birmingham", "Liverpool", "Leeds", "Bristol", "Newcastle upon Tyne", "Glasgow", "Edinburgh", "Cardiff", "Belfast", "Brighton"],

function parseBank(src) {
  const out = [];
  for (const line of src.split("\n")) {
    const i = line.indexOf(":"); if (i < 0) continue;
    const [cat, lvl, ...tags] = line.slice(0, i).trim().split(/\s+/);
    for (const w of line.slice(i + 1).split(",")) { const t = w.trim(); if (t) out.push({ w: t, cat, lvl: +lvl, tags }); }
  }
  return out;
}

/* ============ Turn engine (shared by one-phone and group games) ============ */
const MAX_SKIPS = 3;
function blankTurn(extra) { return { phase: "pass", left: 0, endsAt: 0, cards: [], cur: -1, skips: 0, ...extra }; }
const turnScore = t => t.cards.filter(c => c.res === "got").length;
const skippedCards = t => t.cards.map((c, i) => ({ ...c, i })).filter(c => (c.res === "skip" || c.res === "park") && c.i !== t.cur);
/* Returns a new turn after an action. draw() gives the next {w,cat} or null. */
function applyAct(t, act, arg, draw) {
  t = clone(t);
  const cur = t.cards[t.cur];
  const next = () => { const c = draw(); if (!c) { t.phase = "done"; return; } t.cards.push({ w: c.w, cat: c.cat, res: null }); t.cur = t.cards.length - 1; };
  switch (act) {
    case "start": if (t.cur < 0) next(); t.phase = t.phase === "done" ? "done" : "run"; t.endsAt = Date.now() + t.left; break;
    case "pause": t.left = Math.max(0, t.endsAt - Date.now()); t.phase = "paused"; break;
    case "resume": t.phase = "run"; t.endsAt = Date.now() + t.left; break;
    case "got": cur.res = "got"; next(); break;
    case "skip": if (t.skips >= MAX_SKIPS) return t; cur.res = "skip"; t.skips++; next(); break;
    case "bin": cur.res = "bin"; next(); break;
    case "unskip": { const c = t.cards[arg]; if (!c) return t; if (cur && cur.res == null) cur.res = "park"; c.res = null; t.cur = arg; break; }
    case "timeup": t.phase = "last"; break;
    case "last": if (cur) cur.res = arg ? "got" : "miss"; t.phase = "done"; break;
    case "toggle": { const c = t.cards[arg]; if (c) c.res = c.res === "got" ? "miss" : "got"; break; }
  }
  return t;
}

function startLocal(kind) {

  const teams = quick ? [{ name: profile.nick || "You", players: [] }]
    : st.teams.map((t, i) => ({ name: t.name.trim() || `Team ${i + 1}`, players: parseList(t.players) }));
  const opts = quick
    ? { boundary: profile.prefs.boundary, setting: profile.prefs.setting, seconds: 60, rounds: 1 }
    : { boundary: st.boundary, setting: st.setting, seconds: st.seconds, rounds: st.rounds };
  const run = async () => {
    let ai = [];
    if (!quick && st.ai && CAP.sample) {
      S.cooking = true; render();
      ai = await makeAICards(setupPeople(), opts.boundary, opts.setting, [profile.nick]);
      S.cooking = false;
    } else if (quick && profile.ai?.cards) ai = profile.ai.cards;
    const deckOpts = { people: setupPeople(), boundary: opts.boundary, setting: opts.setting, words: [profile.words], ai };
    game = {
      kind, ...opts, deckOpts, deck: buildDeck(deckOpts),
      teams: teams.map(t => ({ ...t, score: 0 })), round: 1, teamIdx: 0, rot: {}, log: [], over: false,
    };
    game.turn = newLocalTurn();
    go("play");
  };
  run();
}
function newLocalTurn() {
  const t = game.teams[game.teamIdx];
  const r = game.rot[game.teamIdx] || 0;
  return blankTurn({ team: game.teamIdx, left: game.seconds * 1000, describer: t.players.length ? t.players[r % t.players.length] : "" });
}
function localDraw() {

  if (!cats.length) { game.deck = buildDeck(game.deckOpts); cats = CAT_IDS.filter(c => game.deck[c]?.length); if (!cats.length) return null; toast("Deck reshuffled"); }
  return game.deck[pick(cats)].shift();
}

    if (!t || t.phase !== "run") return;

    if (d) { d.textContent = secs; d.classList.toggle("low", secs <= 5); }
    if (b) { b.style.transform = `scaleX(${Math.min(1, left / (secs0 * 1000))})`; b.parentElement.classList.toggle("low", secs <= 5); }
    const mine = local || t.describer === CAP.pid;
    if (mine && secs !== lastSec) { if (secs <= 5 && secs > 0) beep(880, 0.06, 0.08); lastSec = secs; }
    if (mine && left <= 0) { beep(200, 0.7, 0.2); holdScreen(false); S.sheet = null; turnAct("timeup"); return; }

const setPlayer = (id, patch) => chain("player:" + id, () => CAP.db.doc("players/" + id).update(patch));
function partnerOf(p) { const q = p?.partner && ON.players.find(x => x.id === p.partner); return q && q.partner === p.id ? q : null; }
function lobbyPairs() {
  const seen = new Set(), pairs = [];
  for (const p of ON.players) { const q = partnerOf(p); if (q && !seen.has(p.id)) { pairs.push([p.id, q.id]); seen.add(p.id); seen.add(q.id); } }

function buildTeams() {
  const { pairs, single } = lobbyPairs();

  while (rest.length >= 2) pairs.push([rest.pop(), rest.pop()]);
  const teams = shuffle(pairs).map(m => ({ members: m }));
  if (rest.length && teams.length) teams[Math.floor(Math.random() * teams.length)].members.push(rest.pop());

  if (!cats.length) { used.clear(); cats = CAT_IDS.filter(avail); if (!cats.length) return null; }
  const cat = pick(cats);

  const person = id => `<span class="person ${id === CAP.pid ? "me" : ""}">${esc(nameOf(id))}${id === CAP.pid ? " (you)" : ""}</span>`;
  const partner = !me ? "" : mine
    ? `<div class="panel"><div class="label">Your partner</div><div class="spread"><h3>You & ${esc(nameOf(mine.id))}</h3><button class="link" data-act="split">Split up</button></div></div>`
    : `<div class="panel">
        <h3>Find a partner</h3>
        ${incoming.map(p => `<div class="invite"><span><b>${esc(nameOf(p.id))}</b> wants you</span><span class="row"><button class="chip" data-decline="${p.id}">No thanks</button><button class="btn" data-accept="${p.id}">Accept</button></span></div>`).join("")}
        ${asked ? `<div class="invite"><span>Waiting for <b>${esc(nameOf(asked.id))}</b> to say yes</span><button class="chip" data-act="cancel-ask">Cancel</button></div>` : ""}
        ${me.auto ? `<p class="small"><b>You'll get a random partner.</b> If someone else picks random too, you're matched. Otherwise it happens at the start.</p><button class="chip" data-act="auto" aria-pressed="true">Random partner: on</button>`
          : `${free.length ? `<div class="chips">${free.map(p => `<button class="chip" data-ask="${p.id}">${esc(nameOf(p.id))}${p.auto ? " <small>random</small>" : ""}</button>`).join("")}</div>` : `<p class="hint">Nobody else is free yet.</p>`}
             <button class="btn cream" data-act="auto">Give me a random partner</button>`}
      </div>`;
  return screen(
    `${backBar("Leave", "leave", `<span class="label">${LEVELS[G.boundary].name} · ${esc(SETTINGS.find(s => s[0] === G.setting)?.[1] || "")}</span>`)}
     <div class="codebar c-plum"><div><div class="label" style="color:var(--cream)">Game code</div><div class="code">${esc(G.code)}</div></div>
       <p class="small" style="color:var(--cream);max-width:22ch">Everyone taps Join on their phone and types this in.</p></div>`,
    `${partner}
     <div class="panel">
       <div class="label">Pairs so far</div>
       ${pairs.length ? pairs.map((pr, i) => `<div class="row"><span class="pawn" style="background:${teamColour(i)}"></span><div class="people">${pr.map(person).join("")}</div></div>`).join("") : `<p class="hint">No pairs yet.</p>`}
       ${single.length ? `<div class="label">Still single</div><div class="people">${single.map(p => person(p.id)).join("")}</div>` : ""}
       ${isHost && single.length >= 2 ? `<button class="btn ghost" data-act="pair-rest">Pair everyone left at random</button>` : ""}
     </div>
     <p class="hint">Your preferences and your own words go into the deck.${G.ai ? " The host's phone writes fresh cards for the room when the game starts." : ""}</p>`,
    isHost ? (ON.players.length < 4 ? `<div class="wait">You need 4 players for 2 pairs. ${ON.players.length} here so far.</div>`
      : `<button class="btn big orange" data-act="g-start">Start · ${ON.players.length} players</button>`)
      : `<div class="wait">Waiting for the host to start…</div>`,
    false);
}
function renderGroupPlay(G) {
  const t = G.turn, ti = t ? t.team : G.teamIdx, team = G.teams[ti] || { members: [] };
  const myIdx = myTeamIdx(G), onTeam = myIdx === ti;
  const teamEmpty = !(team.members || []).some(id => ON.players.some(p => p.id === id));
  const tName = teamName(team);
  const top = `<div class="spread"><button class="back" data-act="g-menu">☰ Scores</button><span class="label">Round ${G.round} of ${G.rounds}</span></div>`;
  const scores = miniScores(groupScores(G));
  if (!t) {
    const sug = suggestedDescriber(G, ti);
    if (onTeam || teamEmpty) {
      return screen(top,
        `<div class="tile c-orange grow"><span class="sm">${esc(tName)}, you're up</span><span class="lg">${sug === CAP.pid ? "You describe" : sug ? esc(nameOf(sug)) + " describes" : "Who's describing?"}</span></div>
         ${filler()}
         <p class="muted center small">Whoever taps the button gets the cards on their phone.</p>`,
        `${scores}<button class="btn big yellow" data-act="g-describe">I'm describing</button>`, true);
    }
    return screen(top, `<div class="tile c-cream grow"><span class="sm">${esc(tName)} are picking who describes</span><span class="lg">Hang on</span></div>${filler()}`, scores, true);
  }
  const describing = t.describer === CAP.pid;
  const role = describing ? "describer" : onTeam ? "guesser" : "watcher";
  const dName = nameOf(t.describer);
  const takeOver = !describing && (onTeam || teamEmpty) && t.phase !== "done" ? `<p class="card-note"><button class="link" data-act="g-takeover">${esc(dName)} dropped out? Take over</button></p>` : "";
  if (t.phase === "pass") {
    return screen(top,
      `<div class="tile c-plum grow"><span class="sm">${describing ? "You're describing" : `${esc(dName)} is describing`}</span><span class="lg">${describing ? "Ready?" : role === "guesser" ? "Get ready" : "Watch them"}</span></div>
       ${filler()}
       ${describing ? `<p class="muted center small">No saying the word, rhymes or "sounds like". ${MAX_SKIPS} skips. ${G.seconds} seconds.</p>` : ""}`,
      describing ? `<button class="btn big yellow" data-act="t-start">Start the clock</button><button class="link" data-act="g-unclaim">Actually, not me</button>` : scores + takeOver, true);
  }
  if (t.phase === "done") {
    const isLast = ti === G.teams.length - 1 && G.round >= G.rounds;
    return turnSummaryHtml(t, tName, describing || onTeam || teamEmpty, groupScores(G).map(r => r.i === ti ? { ...r, score: r.score + turnScore(t) } : r), isLast ? "See who won" : `Next: ${teamName(G.teams[(ti + 1) % G.teams.length])}`);
  }
  return turnPlayHtml(t, { teamName: tName, seconds: G.seconds, role, boundary: G.boundary, describerName: dName, menu: true, extraFoot: takeOver });
}
function groupNext(G) {
  const t = G.turn, got = turnScore(t);
  const entry = { team: t.team, got, byId: t.describer, by: nameOf(t.describer), skipped: t.cards.filter(c => c.res === "skip" || c.res === "park").map(c => c.w).slice(0, 5), binned: t.cards.filter(c => c.res === "bin").length };
  const log = [...(G.log || []), entry].slice(-60);
  let teamIdx = (t.team + 1) % G.teams.length, round = G.round;
  if (teamIdx === 0) round++;
  if (round > G.rounds) pushGame({ turn: null, log, status: "over" });
  else pushGame({ turn: null, log, teamIdx, round });
  window.scrollTo(0, 0);
}

/* ============ Events ============ */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-act]");
  if (!b) return;
  const act = b.dataset.act;

  if (b.dataset.tab) { go("tabs", b.dataset.tab); return; }
  if (b.dataset.tabGo) { go("tabs", b.dataset.tabGo); return; }
  if (b.dataset.sub) { S.sub[b.dataset.sub] = b.dataset.val; render(); return; }

  // Preference chips (Me tab and game setup)
  if (b.dataset.pref) {
    const name = b.dataset.pref, raw = b.dataset.val;
    if (name.startsWith("s-")) {
      const k = name.slice(2), num = ["boundary", "rounds", "seconds"].includes(k);
      profile.setup[k] = num ? +raw : raw;
      if (k === "setting" && (raw === "family" || raw === "work") && profile.setup.boundary > 1) profile.setup.boundary = 1;
    } else if (b.dataset.multi === "1") {
      const arr = profile.prefs[name] || [];
      profile.prefs[name] = arr.includes(raw) ? arr.filter(x => x !== raw) : [...arr, raw];
    } else profile.prefs[name] = name === "boundary" ? +raw : raw;
    if (name === "boundary") profile.setup.boundary = +raw;
    if (name === "setting") profile.setup.setting = raw;
    if ((name === "s-boundary" || name === "s-setting") && profile.setup.autoNames) autoNameTeams();
    saveProfile(); render(); return;
  }

  switch (act) {
    case "enter": profile.accepted = true; profile.nick = ($("#nick")?.value || profile.nick).trim(); saveProfile(true); go("tabs", "home"); return;
    case "home": if (S.view === "play" && game?.turn?.phase === "run") turnAct("pause"); go("tabs", "home"); return;
    case "quick": startLocal("quick"); return;
    case "step-next": S.step = Math.min(3, S.step + 1); render(); return;
    case "step-back": S.step = Math.max(1, S.step - 1); render(); return;
    case "pairs-open": S.sheet = "pairs"; renderSheet(); return;
    case "g-menu": S.sheet = "menu"; renderSheet(); return;
    case "new-game": S.step = 1; profile.setup.boundary = Math.min(profile.setup.boundary, profile.prefs.age === "Under 18" ? 0 : 3); if (profile.setup.autoNames !== false) autoNameTeams(); saveProfile(true); go("setup"); return;
    case "play-again": S.step = 1; go("setup"); return;
    case "join-open": S.sheet = "join"; renderSheet(); setTimeout(() => $("#join-code")?.focus(), 0); return;
    case "join": joinGame($("#join-code")?.value); return;
    case "resume-local": go("play"); return;
    case "resume-group": go("group"); return;
    case "sign-out":
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to wipe your settings, saved and binned cards"; return; }
      profile = defaultProfile(); saveProfile(true); game = null; go("welcome"); return;
    case "team-add": {
      const st = profile.setup;
      const [name] = st.autoNames ? pickTeamNames(1, st.boundary, st.teams.map(t => t.name)) : [`Team ${st.teams.length + 1}`];
      st.teams.push({ name, players: "" }); saveProfile(true); render(); return;
    }
    case "team-names": autoNameTeams(); saveProfile(true); render(); return;
    case "make-pairs": {
      const names = shuffle(parseList($("#s-names")?.value));
      if (names.length < 2) { toast("Add at least 2 names"); return; }
      const teams = []; while (names.length >= 2) teams.push([names.pop(), names.pop()]);
      if (names.length) teams[Math.floor(Math.random() * teams.length)].push(names.pop());
      profile.setup.teams = teams.slice(0, 6).map(t => ({ name: t.join(" & "), players: t.join(", ") }));
      profile.setup.autoNames = false;
      S.sheet = null; saveProfile(true); render(); toast(`Made ${profile.setup.teams.length} team${profile.setup.teams.length === 1 ? "" : "s"}`); return;
    }
    case "play-local": startLocal("game"); return;
    case "host": if (!CAP.db) { toast("Playing together needs this page open in Claude"); return; } b.disabled = true; hostGame().finally(() => { b.disabled = false; }); return;
    case "ai-stop": aiAbort?.abort(); return;
    case "template": {
      const csv = "word,category,level,tags\nBondi Icebergs,place,light,sydney\nWalk of shame,action,cheeky,\nThe office printer,object,light,work\nSwamp ass,random,sickening,\n";
      CAP.downloads.save({ filename: "what-you-sayin-cards.csv", data: csv }).catch(err => { if (err?.code !== "declined") toast("Couldn't save the template here"); });
      return;
    }
    case "sheet-close": if (e.target.closest(".sheet") && !e.target.closest("button")) return; S.sheet = null; renderSheet(); return;
    // Turn controls
    case "t-start": beep(660, 0.1, 0.1); holdScreen(true); lastSec = null; S.lastCardKey = ""; turnAct("start"); return;
    case "t-got": animatedAct("got"); return;
    case "t-skip": animatedAct("skip"); return;
    case "t-bin": animatedAct("bin"); return;
    case "t-save": { const t = S.view === "play" ? game.turn : gstate().turn, c = t.cards[t.cur]; toggleSave(c.cat, c.w); const on = isSaved(c.cat, c.w); b.setAttribute("aria-pressed", on); b.textContent = on ? "★ Saved" : "☆ Save"; return; }
    case "t-skipped": S.sheet = "skipped"; renderSheet(); return;
    case "t-unskip": S.sheet = null; renderSheet(); turnAct("unskip", +b.dataset.i); return;
    case "t-pause": turnAct("pause"); holdScreen(false); return;
    case "t-resume": holdScreen(true); turnAct("resume"); return;
    case "t-last-yes": turnAct("last", true); return;
    case "t-last-no": turnAct("last", false); return;
    case "t-toggle": turnAct("toggle", +b.dataset.i); return;
    case "t-next": if (S.view === "play") finishLocalTurn(); else groupNext(gstate()); return;
    // Group
    case "leave": leaveGame(); return;
    case "group-done": leaveGame(); return;
  }

  if (b.dataset.unsave != null) { profile.saved.splice(+b.dataset.unsave, 1); saveProfile(true); render(); return; }
  if (b.dataset.unbin != null) { profile.rejected.splice(+b.dataset.unbin, 1); saveProfile(true); render(); return; }
  if (b.dataset.teamRm != null) { profile.setup.teams.splice(+b.dataset.teamRm, 1); saveProfile(true); render(); return; }

  if (S.view !== "group") return;
  const G = gstate(); if (!G) return;
  const me = myPlayer(), isHost = G.host === CAP.pid;
  if (b.dataset.ask && me) {
    const other = ON.players.find(p => p.id === b.dataset.ask);
    if (other?.partner === CAP.pid || other?.auto) pairUp(CAP.pid, other.id);
    else setPlayer(CAP.pid, { partner: b.dataset.ask, auto: false });
    return;
  }
  if (b.dataset.accept) { pairUp(CAP.pid, b.dataset.accept); return; }
  if (b.dataset.decline) { setPlayer(b.dataset.decline, { partner: null }); return; }
  if (b.dataset.jointeam != null) {
    const i = +b.dataset.jointeam;
    pushGame({ teams: G.teams.map((t, j) => ({ members: [...t.members.filter(id => id !== CAP.pid), ...(j === i ? [CAP.pid] : [])] })) });
    S.sheet = null; renderSheet();
    return;
  }
  switch (act) {
    case "cancel-ask": setPlayer(CAP.pid, { partner: null }); return;
    case "split": { const q = partnerOf(me); setPlayer(CAP.pid, { partner: null, auto: false }); if (q) setPlayer(q.id, { partner: null }); return; }
    case "auto": {
      if (!me) return;
      if (me.auto) { setPlayer(CAP.pid, { auto: false }); return; }
      const waiting = lobbyPairs().single.find(p => p.id !== CAP.pid && p.auto && !p.partner);
      if (waiting) { pairUp(CAP.pid, waiting.id); toast(`You're with ${nameOf(waiting.id)}`); }
      else setPlayer(CAP.pid, { auto: true, partner: null });
      return;
    }
    case "pair-rest": if (isHost) { const rest = shuffle(lobbyPairs().single.map(p => p.id)); while (rest.length >= 2) pairUp(rest.pop(), rest.pop()); if (rest.length) toast(`${nameOf(rest[0])} is spare and will join a pair as a three`); } return;
    case "g-start": if (isHost) startGroupGame(G); return;
    case "g-end": if (isHost) { if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to end it"; return; } pushGame({ status: "over", turn: null }); } return;
    case "g-describe": pushGame({ turn: blankTurn({ team: G.teamIdx, describer: CAP.pid, left: G.seconds * 1000 }) }); return;
    case "g-unclaim": pushGame({ turn: null }); return;
    case "g-takeover": pushGame({ turn: { ...G.turn, describer: CAP.pid } }); return;
  }
});

let nickTimer, setupTimer, wordsTimer;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "nick") { profile.nick = el.value.trim(); clearTimeout(nickTimer); nickTimer = setTimeout(() => { saveProfile(); if (ON.code) setPlayer(CAP.pid, { nick: profile.nick }); }, 500); }
  if (el.id && el.id.startsWith("pref-")) { profile.prefs[el.id.slice(5)] = el.id === "pref-age" ? el.value : el.value.trim(); if (el.id === "pref-age" && el.value === "Under 18") { profile.prefs.boundary = 0; profile.setup.boundary = 0; } saveProfile(); if (el.tagName === "SELECT") render(); }
  if (el.dataset.words) { profile.words[el.dataset.words] = el.value; clearTimeout(wordsTimer); wordsTimer = setTimeout(() => saveProfile(true), 600); }
  if (el.dataset.teamName != null) { profile.setup.teams[+el.dataset.teamName].name = el.value; profile.setup.autoNames = false; clearTimeout(setupTimer); setupTimer = setTimeout(() => saveProfile(true), 500); }
  if (el.dataset.teamPlayers != null) { profile.setup.teams[+el.dataset.teamPlayers].players = el.value; clearTimeout(setupTimer); setupTimer = setTimeout(() => saveProfile(true), 500); }
  if (el.id === "s-names") { profile.setup.names = el.value; clearTimeout(setupTimer); setupTimer = setTimeout(() => saveProfile(true), 500); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "s-ai") { profile.setup.ai = el.checked; saveProfile(true); }
  if (el.id === "bank-file" && el.files?.[0]) importBank(el.files[0]);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "join-code") joinGame(e.target.value); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  if (S.view === "play" && game?.turn?.phase === "run") turnAct("pause");
  if (S.view === "group") oPauseIfDescribing();
});

/* ============ Spreadsheet import (owner) ============ */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = rej;
    document.head.appendChild(s);
  });
}
const LEVEL_WORDS = { pg: 0, light: 0, clean: 0, "adults only": 1, cheeky: 1, unhinged: 2, sickening: 2 };
async function importBank(file) {
  const status = $("#import-status"); const say = m => { if (status) status.textContent = m; };
  say("Reading " + file.name + "…");
  let rows;
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
  } catch (e) { say("Couldn't read that file. Save it as .xlsx or .csv and try again."); return; }
  const norm = r => Object.fromEntries(Object.entries(r).map(([k, v]) => [String(k).trim().toLowerCase(), String(v).trim()]));
  const cards = [], bad = [];
  rows.map(norm).forEach((r, i) => {
    const w = r.word || r.card || r.words;
    const cat = (r.category || r.cat || "").toLowerCase();
    const lv = (r.level || r.boundary || "light").toLowerCase();
    const lvl = lv in LEVEL_WORDS ? LEVEL_WORDS[lv] : /^[0-3]$/.test(lv) ? Math.min(+lv, MAX_LEVEL) : null;
    if (!w || !CAT_IDS.includes(cat) || lvl == null) { bad.push(i + 2); return; }
    cards.push([w.slice(0, 60), cat, lvl, (r.tags || "").toLowerCase().split(/[\s,]+/).filter(Boolean)]);
  });
  if (!cards.length) { say("No usable rows. Check the column names: word, category, level, tags."); return; }
  const keep = $("#keep-builtin")?.checked !== false;
  try {
    const size = 1500, n = Math.ceil(cards.length / size);
    const old = await CAP.db.doc("bank/meta").get().catch(() => null);
    for (let i = 0; i < n; i++) await CAP.db.doc("bank/c" + i).set({ cards: cards.slice(i * size, (i + 1) * size) });
    for (let i = n; i < (old?.exists ? old.data().chunks || 0 : 0); i++) await CAP.db.doc("bank/c" + i).delete();
    await CAP.db.doc("bank/meta").set({ chunks: n, count: cards.length, at: Date.now(), useBuiltIn: keep });
  } catch (e) { say(e?.code === "invalid_argument" ? "Only the owner or an editor can load cards into the bank." : "Couldn't save the cards. Try again."); return; }
  IMPORTED = cards.map(([w, cat, lvl, tags]) => ({ w, cat, lvl, tags })); useBuiltIn = keep;
  render();
  toast(`Loaded ${cards.length} cards${bad.length ? `. Skipped ${bad.length} row${bad.length === 1 ? "" : "s"} with missing bits` : ""}`);
}

/* ============ Boot ============ */
S.view = profile.accepted ? "tabs" : "welcome";
render();
initCaps();
</script>
