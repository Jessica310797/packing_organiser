<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Packing Organiser</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🧳 Packing Organiser</h1>
    <p class="subtitle">Software MVP — no camera hardware yet. Upload photos as you pack.</p>
  </header>

  <main>
    <section id="trip-picker" class="card">
      <h2>Trips</h2>
      <div id="trip-list"></div>
      <details>
        <summary>+ New trip</summary>
        <form id="trip-form">
          <label>Destination <input name="destination" required placeholder="Lisbon, Portugal" /></label>

          <label>Trip Purpose
            <select name="purpose" required>
              <option value="" disabled selected>Select trip purpose</option>
              <option>Leisure / Holiday</option>
              <option>City Break</option>
              <option>Beach Holiday</option>
              <option>Adventure / Outdoor</option>
              <option>Work Trip</option>
              <option>Conference / Work Event</option>
              <option>Wedding (Guest)</option>
              <option>Stag Do</option>
              <option>Hen Do</option>
              <option>Honeymoon</option>
              <option>Babymoon</option>
              <option>Family Visit</option>
              <option>Reunion</option>
              <option>Festival / Event</option>
              <option>Road Trip</option>
              <option value="__other">Other (specify)</option>
            </select>
          </label>
          <label id="purpose-other-label" class="hidden">Describe the trip purpose
            <input name="purposeOther" placeholder="e.g. Sabbatical" />
          </label>

          <fieldset class="activities-fieldset">
            <legend>Activities</legend>
            <div class="checkbox-grid">
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Hiking" /> Hiking</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Swimming" /> Swimming</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Watersports" /> Watersports</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Camping" /> Camping</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Skiing / Snowboarding" /> Skiing / Snowboarding</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Cycling" /> Cycling</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Diving / Snorkeling" /> Diving / Snorkeling</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Fishing" /> Fishing</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Golf" /> Golf</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Running" /> Running</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Climbing" /> Climbing</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Sightseeing" /> Sightseeing</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Museums / Culture" /> Museums / Culture</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Nightlife" /> Nightlife</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Shopping" /> Shopping</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Spa / Wellness" /> Spa / Wellness</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Food Tours" /> Food Tours</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Wildlife / Safari" /> Wildlife / Safari</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Photography" /> Photography</label>
              <label class="checkbox-label"><input type="checkbox" name="activity" value="Business Meetings" /> Business Meetings</label>
            </div>
            <input name="activityOther" placeholder="Add another activity" class="activity-other-input" />
          </fieldset>

          <label>Start date <input name="startDate" type="date" required /></label>
          <label>End date <input name="endDate" type="date" required /></label>
          <button type="submit">Create trip</button>
        </form>
      </details>
    </section>

    <section id="trip-view" class="card hidden">
      <div class="trip-header">
        <div>
          <h2 id="trip-title"></h2>
          <p id="trip-meta" class="subtitle"></p>
        </div>
        <button id="change-trip" class="link-button">Change trip</button>
      </div>

      <div class="upload-box">
        <label class="upload-label">
          📷 Upload / take a packing photo
          <input id="photo-input" type="file" accept="image/*" capture="environment" />
        </label>
        <div id="upload-status"></div>
      </div>

      <div id="last-result" class="hidden"></div>

      <div class="grid">
        <div>
          <h3>Packed inventory (<span id="inventory-count">0</span>)</h3>
          <div id="inventory-list"></div>
          <details>
            <summary>+ Add item manually</summary>
            <form id="add-item-form">
              <input name="name" required placeholder="Item name" />
              <input name="category" placeholder="Category (optional)" />
              <input name="quantity" type="number" min="1" value="1" />
              <button type="submit">Add</button>
            </form>
          </details>
        </div>

        <div>
          <h3>Needs your review (<span id="review-count">0</span>)</h3>
          <div id="review-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
